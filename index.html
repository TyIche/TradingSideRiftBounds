<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>riftbound 중국어 카드 가격</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f8;
      --ink: #151922;
      --muted: #697386;
      --card: #ffffff;
      --line: #d8dee8;
      --accent: #0f766e;
      --price: #9a3412;
      --shadow: 0 12px 30px rgba(21, 25, 34, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #eaf0f5 0, var(--bg) 280px), var(--bg);
      line-height: 1.45;
    }

    header {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 20px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .count {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .compare-toggle,
    .lang-toggle,
    .total {
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      font: inherit;
      font-size: 14px;
      white-space: nowrap;
    }

    .compare-toggle,
    .lang-toggle {
      cursor: pointer;
      color: var(--ink);
      font-weight: 750;
    }

    .compare-toggle[aria-pressed="true"],
    .lang-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: #e0f2ef;
      color: var(--accent);
    }

    .total {
      display: grid;
      place-items: center;
    }

    main {
      width: min(1220px, calc(100% - 32px));
      margin: 22px auto 44px;
    }

    .rule-banner {
      width: min(1220px, calc(100% - 32px));
      margin: 16px auto 0;
      padding: 14px 16px;
      display: grid;
      gap: 6px;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      background: #ecfdf5;
      color: #064e3b;
    }

    .rule-banner a {
      color: #047857;
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .rule-banner a:hover {
      text-decoration: underline;
    }

    .rule-banner p {
      margin: 0;
      font-size: 14px;
      color: #115e59;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      gap: 16px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .image-wrap {
      position: relative;
      aspect-ratio: 63 / 88;
      background: #dfe6ef;
      overflow: hidden;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      padding: 12px 12px 13px;
      display: grid;
      gap: 7px;
    }

    .name {
      min-height: 42px;
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 0;
      word-break: break-word;
    }

    .number {
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .price {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--price);
      font-weight: 850;
      font-size: 20px;
      letter-spacing: 0;
    }

    .price span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .compare {
      display: grid;
      gap: 5px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .compare-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .compare-row strong {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      text-align: right;
    }

    .compare-row .higher { color: #b42318; }
    .compare-row .lower { color: #067647; }
    .compare-row .same { color: var(--muted); }

    .rnd-name {
      min-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-image {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      padding: 18px;
      text-align: center;
    }

    @media (max-width: 620px) {
      header {
        align-items: start;
        flex-direction: column;
      }

      .header-tools {
        width: 100%;
      }

      .compare-toggle,
      .lang-toggle,
      .total {
        flex: 1 1 0;
      }

      .catalog {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .name {
        min-height: 38px;
        font-size: 14px;
      }

      .price {
        font-size: 19px;
      }
    }
  </style>
</head>

      { nameKo: "이케시아 폭우", nameEn: "Icathian Rain", number: "OGN.248/298", price: 3708, rndPrice: 4800, image: "https://jihuanshe-r2-imagex.jihuanshe.com/lol/card_versions/next/23-sc-1764067084.jpg~tplv-2yt7131h9y-compress.image" },
      { nameKo: "브린히르 썬더송", nameEn: "Brynhir Thundersong", number: "OGN.026/298", price: 2266, rndPrice: 4800, image: "https://jihuanshe-r2-imagex.jihuanshe.com/lol/card_versions/next/312-sc-1764067006.jpg~tplv-2yt7131h9y-compress.image" },
      { nameKo: "다리우스 트리파르", nameEn: "Darius, Trifarian", number: "OGN.027/298", price: 2060, rndPrice: 3600, image: "https://jihuanshe-r2-imagex.jihuanshe.com/lol/card_versions/next/26-sc-1764067004.jpg~tplv-2yt7131h9y-compress.image" },
      { nameKo: "정신 분쇄자", nameEn: "Mindsplitter", number: "OGN.192/298", price: 1854, rndPrice: 2400, image: "https://jihuanshe-r2-imagex.jihuanshe.com/lol/card_versions/next/278-sc-1764067071.jpg~tplv-2yt7131h9y-compress.image" },
      { nameKo: "쌍권총 난사", nameEn: "Bullet Time", number: "OGN.268/298", price: 1854, rndPrice: 7200, image: "https://jihuanshe-r2-imagex.jihuanshe.com/lol/card_versions/next/63-sc-1764067089.jpg~tplv-2yt7131h9y-compress.image" },
    ];

    const copy = {
      ko: {
        subtitle: "전체 가격 비교 표시 · 환율 206",
        sortByGap: "가격 차이순",
        sortByPrice: "가격순 복원",
        language: "English",
        total: `${cards.length}장`,
        price: "가격",
        rnd: "RND",
        gap: "차액",
        unmatched: "미매칭",
        same: "동일",
        higher: "높음",
        lower: "낮음",
        ruleLink: "Ref: https://playriftbound.com/en-us/news/announcements/tournament-rules-january-update/",
        ruleText: "규칙 420에 따라 공식 Riftbound 카드는 언어와 상관없이 덱에 함께 사용할 수 있습니다. 한국어 카드와 중국어 카드를 섞어 쓰고, 더 저렴한 중국어 카드를 고를 수 있어요.",
        pageTitle: "riftbound 중국어 카드 가격"
      },
      en: {
        subtitle: "Showing all comparisons · rate 206",
        sortByGap: "Sort by gap",
        sortByPrice: "Restore price sort",
        language: "한국어",
        total: `${cards.length} cards`,
        price: "Price",
        rnd: "RND",
        gap: "Gap",
        unmatched: "No match",
        same: "Even",
        higher: "Higher",
        lower: "Lower",
        ruleLink: "Ref: https://playriftbound.com/en-us/news/announcements/tournament-rules-january-update/",
        ruleText: "Rule 420 lets official Riftbound cards of any language be used together in decks. You can mix Korean and Chinese cards, then choose lower-priced Chinese copies.",
        pageTitle: "riftbound Chinese card prices"
      }
    };

    const formatter = new Intl.NumberFormat("ko-KR", {
      maximumFractionDigits: 0
    });

    const catalog = document.querySelector("#catalog");
    const compareToggle = document.querySelector("#compareToggle");
    const langToggle = document.querySelector("#langToggle");
    const subtitle = document.querySelector("#subtitle");
    const totalCount = document.querySelector("#totalCount");
    const ruleLink = document.querySelector("#ruleLink");
    const ruleText = document.querySelector("#ruleText");
    const pageTitle = document.querySelector("#pageTitle");
    let sortByGap = false;
    let language = "ko";

    const t = (key) => copy[language][key];
    const cardName = (card) => language === "ko" ? card.nameKo : card.nameEn;
    const formatWon = (value) => value == null ? t("unmatched") : `₩${formatter.format(value)}`;
    const getGap = (card) => card.rndPrice == null ? null : card.price - card.rndPrice;
    const formatGap = (gap) => {
      if (gap == null) return t("unmatched");
      if (gap === 0) return t("same");
      return `${gap > 0 ? t("higher") : t("lower")} ${formatWon(Math.abs(gap))}`;
    };
    const gapClass = (gap) => gap == null || gap === 0 ? "same" : gap > 0 ? "higher" : "lower";

    const syncChrome = () => {
      document.documentElement.lang = language;
      subtitle.textContent = t("subtitle");
      totalCount.textContent = t("total");
      compareToggle.textContent = sortByGap ? t("sortByPrice") : t("sortByGap");
      langToggle.textContent = t("language");
      langToggle.setAttribute("aria-pressed", String(language === "en"));
      ruleLink.textContent = t("ruleLink");
      ruleText.textContent = t("ruleText");
      pageTitle.textContent = t("pageTitle");
      document.title = t("pageTitle");
    };

    const render = () => {
      syncChrome();
      const visibleCards = [...cards].sort((a, b) => {
        if (!sortByGap) return b.price - a.price;
        const gapA = getGap(a);
        const gapB = getGap(b);
        if (gapA == null && gapB == null) return b.price - a.price;
        if (gapA == null) return 1;
        if (gapB == null) return -1;
        return gapB - gapA || b.price - a.price;
      });

      catalog.innerHTML = visibleCards.map((card) => {
        const gap = getGap(card);
        const name = cardName(card);
        const rndMeta = card.rndPrice == null ? t("unmatched") : name;

        return `
      <article class="card">
        <div class="image-wrap">
          ${card.image
            ? `<img src="${card.image}" alt="${name} ${card.number}" loading="lazy" referrerpolicy="no-referrer" />`
            : `<div class="empty-image">이미지 없음</div>`}
        </div>
        <div class="info">
          <h2 class="name">${name}</h2>
          <div class="number">${card.number}</div>
          <div class="price"><span>${t("price")}</span>${formatWon(card.price)}</div>
          <div class="compare">
            <div class="compare-row"><span>${t("rnd")}</span><strong>${formatWon(card.rndPrice)}</strong></div>
            <div class="compare-row"><span>${t("gap")}</span><strong class="${gapClass(gap)}">${formatGap(gap)}</strong></div>
            <div class="rnd-name">${rndMeta}</div>
          </div>
        </div>
      </article>`;
      }).join("");
    };

    compareToggle.addEventListener("click", () => {
      sortByGap = !sortByGap;
      compareToggle.setAttribute("aria-pressed", String(sortByGap));
      render();
    });

    langToggle.addEventListener("click", () => {
      language = language === "ko" ? "en" : "ko";
      render();
    });

    render();
  </script>
</body>
