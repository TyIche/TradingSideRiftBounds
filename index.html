  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f8;
      --ink: #151922;
      --muted: #697386;
      --card: #ffffff;
      --line: #d8dee8;
      --accent: #0f766e;
      --price: #9a3412;
      --shadow: 0 12px 30px rgba(21, 25, 34, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #eaf0f5 0, var(--bg) 280px), var(--bg);
      line-height: 1.45;
    }

    header {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 20px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .count {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .total {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    main {
      width: min(1220px, calc(100% - 32px));
      margin: 22px auto 44px;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      gap: 16px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .image-wrap {
      position: relative;
      aspect-ratio: 63 / 88;
      background: #dfe6ef;
      overflow: hidden;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      padding: 12px 12px 13px;
      display: grid;
      gap: 7px;
    }

    .name {
      min-height: 42px;
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 0;
      word-break: break-word;
    }

    .number {
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .price {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--price);
      font-weight: 850;
      font-size: 22px;
      letter-spacing: 0;
    }

    .price span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .empty-image {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      padding: 18px;
      text-align: center;
    }

    @media (max-width: 620px) {
      header {
        align-items: start;
        flex-direction: column;
      }

      .total {
        width: 100%;
        text-align: center;
      }

      .catalog {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .name {
        min-height: 38px;
        font-size: 14px;
      }

      .price {
        font-size: 19px;
      }
    }
  </style>
